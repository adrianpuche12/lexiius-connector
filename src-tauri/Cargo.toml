[package]
name = "lexiius-connector"
version = "1.0.0"
description = "Lexiius Connector — conecta Lexiius con Claude Desktop en 1 click"
authors = ["Nilo Solutions"]
edition = "2021"

[lib]
name = "lexiius_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lexiius-connector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-default"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
