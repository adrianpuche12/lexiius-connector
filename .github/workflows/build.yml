name: Build Lexiius Connector

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test-js:
    name: Tests JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  test-rust:
    name: Tests Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cd src-tauri && cargo test

  build-windows:
    name: Build Windows
    needs: [test-js, test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Compile MCP server to standalone exe (no Node.js required)
        run: |
          mkdir -p src-tauri/bin
          npx pkg src-tauri/src/lexiius-mcp.js --target node18-win-x64 --output src-tauri/bin/lexiius-mcp-server-x86_64-pc-windows-msvc.exe
      - name: Build Tauri app
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lexiius-connector-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lexiius-connector-windows
          path: installers/
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v1
        with:
          name: "Lexiius Connector ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Lexiius Connector ${{ steps.version.outputs.VERSION }}

            Conecta Lexiius con Claude Desktop en 1 click.

            ### Requisitos
            - Windows 10 / 11 (64 bits)
            - ~~Node.js~~ **No requiere Node.js** — incluido en el instalador

            ### Instalacion
            1. Descarga el archivo `.exe`
            2. Doble click - Siguiente - Instalar
            3. El icono de Lexiius aparece en la barra de tareas
            4. En Lexiius - crea una conexion - Claude Desktop se configura solo
          files: installers/**
          draft: false
          prerelease: false
